name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify (tests, Checkstyle, SpotBugs)
        run: mvn -B verify

      - name: Spotless format check
        run: mvn -B spotless:check

      - name: Install cfn-lint
        run: pipx install cfn-lint

      - name: Lint SAM template
        run: cfn-lint template.yaml
